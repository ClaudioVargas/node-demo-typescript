name: CI/CD Push (CIOps)

# =============================================================================
# ESTRATEGIA: Push (CIOps)
# -----------------------------------------------------------------------------
# El CI se dispara con un PUSH a main/develop (rama o tag), se valida el código,
# se construye la imagen Docker y se publica hacia un registro OCI
# (GitHub Container Registry). El despliegue automático de los artefactos
# publicados al entorno de producción se deja al operador (workflow manual
# `.github/workflows/deploy.yml`).
#
# Tags semánticos (vX.Y.Z) disparan PUBLICACIÓN OCI con tag semántico + latest:
#   - v1.2.3  -> ghcr.io/<owner>/<repo>:1.2.3  y  ghcr.io/<owner>/<repo>:latest
# Una rama (main) también publica bajo una etiqueta de rama y `latest`.
# =============================================================================

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
    # Opcional: CI solo para el Dockerfile/código fuente. Descomenta si prefieres.
    # paths:
    #   - "src/**"
    #   - "tests/**"
    #   - "Dockerfile"
    #   - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Publicación en GHCR
  packages: write

env:
  # Registro de destino de la imagen
  REGISTRY: ghcr.io
  # Cambia por tu usuario/organización de GitHub (los proyectos de GIthub usan
  # minúsculas en las imágenes OCI).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Verificación y calidad
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 2) Build de la imagen Docker
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Push (OCI)
    runs-on: ubuntu-latest
    needs: test
    # Solo ramas o tags: en push de ramas hacemos build (push solo con tag/rama
    # principal según la condición siguiente).
    # Lo dejamos simplificado: siempre construimos; el push se hace solo cuando
    # toca publicar.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta data (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2b) Smoke test E2E: arranca la imagen construida con MySQL real y valida
  #     que el contenedor queda "healthy" y responde. Detecta regresiones de
  #     runtime (p. ej. errores de sincronización de modelos) que los tests
  #     unitarios no cubren.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test (Docker + MySQL)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for compose (CI)
        run: |
          cp .env.example .env
          # Dentro de compose la BD es el servicio `db`, no localhost.
          sed -i 's/^DB_HOST=.*/DB_HOST=db/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=1234/' .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait until app is healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' node-demo-app 2>/dev/null || echo starting)
            echo "app status=$status (intento $i/40)"
            if [ "$status" = "healthy" ]; then
              echo "App healthy ✓"
              exit 0
            fi
            sleep 10
          done
          echo "App no alcanzó estado healthy. Logs:"
          docker compose logs app
          exit 1

      - name: Verify API responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs/json)
          echo "GET /docs/json -> $code"
          [ "$code" = "200" ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs app

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3) Artefactos para despliegue (trigger de CIOps)
  # ---------------------------------------------------------------------------
  deploy-trigger:
    name: Emit artifact for deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve artifact name and tag
        id: meta
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "artifact=ghcr.io/${{ github.repository }}:$TAG" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "artifact=ghcr.io/${{ github.repository }}:$BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          echo "Artifact publicado: ${{ steps.meta.outputs.artifact }}"
          echo "Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Autor: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"